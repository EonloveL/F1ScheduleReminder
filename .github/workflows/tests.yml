name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Ubuntu 26.04 (即将成为 ubuntu-latest) 的 actions/setup-python 不提供 3.8，
    # 固定 24.04 以保证 Python 3.8 + 3.12 双版本可用。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # CI 测试不需要 faster-whisper/live extra（其 onnxruntime 依赖不支持 3.8）
        run: uv sync --locked --extra qq --extra discord --dev
      - name: Lint with ruff
        run: uv run ruff check common/ handlers/ discord_version/ tests/
      - name: Run tests
        run: uv run pytest tests -q
