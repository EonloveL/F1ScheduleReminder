[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 本项目不是可安装的 Python 包，pyproject.toml 仅用于 uv 依赖锁定。
# bypass-selection 避免 hatchling 因找不到同名包目录而报错。
[tool.hatch.build.targets.wheel]
bypass-selection = true

[project]
name = "f1-schedule-reminder"
version = "2.0.0"
description = "F1 赛程提醒机器人：QQ 官方群 Bot + Discord 版，定时推送、群指令、AI 问答与统计预测"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "EonloveL", email = "eonlovel@example.com"},
]
keywords = ["f1", "formula1", "bot", "qq", "discord", "scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # 核心运行时（QQ + Discord 共有）
    "APScheduler>=3.10.0,<4",
    "pytz>=2023.3",
    "requests>=2.28.0,<3",
    "python-dateutil>=2.8.0,<3",
    "python-dotenv>=1.0.0,<2",

    # Web 服务（评分表单、实时面板、ICS 日历）
    "flask>=3.0.0,<4",
    "gunicorn>=21.0.0,<24",

    # 数据/图表（3.7 起兼容 Python 3.8；<3.12 防止 3.11+ .tmp 格式识别等破坏性变更）
    "matplotlib>=3.7.0,<3.12",
    "pandas>=2.0.0,<3",

    # FIA 文档 PDF 解析
    "pdfplumber>=0.11.0,<1",

    # livetiming TLS 指纹伪装
    "curl-cffi>=0.7.0,<1",
]

[project.optional-dependencies]
qq = [
    "qq-botpy>=1.2.1,<2",
    "nest-asyncio>=1.5.0,<2",
    "cryptography>=41.0.0,<47",
    "qrcode>=7.4,<9",
]
discord = [
    "py-cord>=2.4.0,<3",
]
live = [
    # 实时计时面板 TR 转写（server_deploy_qq_official/requirements-live.txt）
    "faster-whisper>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/EonloveL/F1ScheduleReminder"
Repository = "https://github.com/EonloveL/F1ScheduleReminder"
Issues = "https://github.com/EonloveL/F1ScheduleReminder/issues"

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "*.pyc",
    "tr_studio_runtime",
    "go-cqhttp",
    "napcat_win",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # 行长度由 formatter/black 处理，ruff 只做逻辑检查
    "SIM105",  # contextlib.suppress 在 Python 3.8 项目中可保留显式 try/except
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
